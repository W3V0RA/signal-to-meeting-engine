name: Offline checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DRY_RUN: 'true'
      LIVE_SEND_ENABLED: 'false'
      CONTROLLED_AUTONOMY_ENABLED: 'false'
      INTEGRATION_WRITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --offline
      - run: npm run check
      - run: npm run demo
      - run: npm run setup
      - run: npm run doctor
      - run: npm run worker
      - run: npm run backup
      - run: npm run scan
